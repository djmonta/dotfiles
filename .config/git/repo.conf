[user]
	name = monta
	email = djmonta@gmail.com
	signingkey = FA019D34F1DD8BC7
[commit]
	gpgsign = true
	template = ~/dotfiles/.config/git/.gittemplate
[gpg]
	program = /usr/local/MacGPG2/bin/gpg2
[mergetool]
	keepBackup = true
	prompt = false
[color]
	ui = true
[core]
	excludesfile = ~/dotfiles/.config/git/.gitignore.default
	quotepath = false
[i18n]
	logoutputencoding = utf-8
	commitencoding = utf-8

[gpg]
    program = /usr/local/MacGPG2/bin/gpg2

[interactive]
    diffFilter = delta --color-only --feature=interactive

[merge]
    conflictstyle = diff3

[diff]
    colorMoved = default

[delta]
    features = decorations
    line-numbers = true
    syntax-theme = Visual Studio Dark+
    tabs = 4
    true-color = always

[delta "interactive"]
    keep-plus-minus-markers = false

[delta "decorations"]
    commit-decoration-style = blue ol
    commit-style = raw
    default-language = php
    file-style = omit
    hunk-header-decoration-style = blue box
    hunk-header-file-style = red
    hunk-header-line-number-style = "#067a00"
    hunk-header-style = file line-number syntax